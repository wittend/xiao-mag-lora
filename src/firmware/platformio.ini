; XIAO / Wio-S3 P2P LoRa node firmware
;
; Two environments:
;   [env:native]        - host (x86) build of the portable modules + unit test.
;                         No PlatformIO hardware required. Quick sanity build.
;   [env:wio_s3_lora]   - the real ESP32-S3 device build/flash target.
;
; NOTE (Q3): confirm the exact board definition for the Wio-S3 LoRa once the
; datasheet is in assets/. Seeed ships a 'Wio-S3-LoRa' board def in recent
; PlatformIO ESP32 packages; 'seeed_xiao_esp32s3' is a fallback (same MCU, but
; the LoRa radio pins will differ - see radio_stub / TODO notes).

[platformio]
default_envs = native
src_dir = src
include_dir = include
test_dir = test

; ---------------------------------------------------------------------------
; Host build: portable, hardware-free modules (frame codec, store, link, NMEA).
; These are the pure-logic pieces and are the ones the unit test exercises.
; ---------------------------------------------------------------------------
[env:native]
platform = native
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -O2
build_src_filter =
    +<lora_frame.cpp>
    +<sample_store.cpp>
    +<link.cpp>
    +<gnss_nmea.cpp>
    +<radio_stub.cpp>
    +<sensor_dummy.cpp>
    +<native_main.cpp>
    -<main.cpp>
    -<radio_sx1262.cpp>
lib_ignore =

; ---------------------------------------------------------------------------
; Device build: ESP32-S3 (Arduino). Drives the SX126x in LoRa direct mode.
; ---------------------------------------------------------------------------
[env:wio_s3_lora]
platform = espressif32
board = seeed_xiao_esp32s3     ; TODO(Q3): no stock 'Wio-S3-LoRa' board def in PlatformIO; this XIAO ESP32-S3 is the same MCU. Swap to the confirmed Wio-S3 LoRa board def when the datasheet lands.
framework = arduino
monitor_speed = 115200
board_build.partitions = no_ota.csv
build_flags =
    -std=gnu++17
    -Wall
    ; Real SX1262 driver (RadioLib) enabled by default -> the built firmware is a
    ; working P2P PoC node. If the SX1262 fails to init (the boot diagnostic prints
    ; "begin: FAIL (RadioLib error N)" plus the pin map), the 4 [BENCH-VERIFY]
    ; control pins in include/xiao_pins.hpp are the likely cause. To build without
    ; the radio (pure toolchain sanity) comment out the -D line below.
    -DXLORA_USE_SX1262
lib_deps =
    ; SX1262 LoRa driver (LoRa direct mode), v7.x maintained by Jan Gromes (jgromes/RadioLib, a fork of Sandeep Mistry's RadioLib).
    ; Pulled from source via git. NOTE: the correct owner is 'jgromes' — earlier
    ; notes carried a wrong owner that 404'd, which made PlatformIO's git clone
    ; fall through to a credential prompt and fail.
    https://github.com/jgromes/RadioLib.git
