; XIAO / Wio-S3 P2P LoRa node firmware
;
; Two environments:
;   [env:native]        - host (x86) build of the portable modules + unit test.
;                         No PlatformIO hardware required. Quick sanity build.
;   [env:wio_s3_lora]   - the real ESP32-S3 device build/flash target.
;
; NOTE (Q3): confirm the exact board definition for the Wio-S3 LoRa once the
; datasheet is in assets/. Seeed ships a 'Wio-S3-LoRa' board def in recent
; PlatformIO ESP32 packages; 'seeed_xiao_esp32s3' is a fallback (same MCU, but
; the LoRa radio pins will differ - see radio_stub / TODO notes).

[platformio]
default_envs = native
src_dir = src
include_dir = include
test_dir = test

; ---------------------------------------------------------------------------
; Host build: portable, hardware-free modules (frame codec, store, link, NMEA).
; These are the pure-logic pieces and are the ones the unit test exercises.
; ---------------------------------------------------------------------------
[env:native]
platform = native
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -O2
build_src_filter =
    +<lora_frame.cpp>
    +<sample_store.cpp>
    +<link.cpp>
    +<gnss_nmea.cpp>
    +<radio_stub.cpp>
    +<native_main.cpp>
    -<main.cpp>
lib_ignore =

; ---------------------------------------------------------------------------
; Device build: ESP32-S3 (Arduino). Drives the SX126x in LoRa direct mode.
; ---------------------------------------------------------------------------
[env:wio_s3_lora]
platform = espressif32
board = Wio-S3-LoRa            ; TODO(Q3): confirm against the datasheet
framework = arduino
monitor_speed = 115200
board_build.partitions = no_ota.csv
build_flags =
    -std=gnu++17
    -Wall
lib_deps =
    ; Intended SX126x driver for LoRa direct mode (TX/RX, SF, freq, sync word).
    sbabdadee/RadioLib @ ^7.1.0
